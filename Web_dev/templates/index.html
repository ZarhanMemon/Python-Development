<!DOCTYPE html>
<html>
    <head>
        <title>Document</title>
    </head>

    <body>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for msg in messages %}
                        <li> {{msg}} </li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <h1>This is flask server</h1>
    </body>
</html>
